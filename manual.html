<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>取扱説明書</title>
<style>
  :root{ --green:#2f7d32; --green-d:#1f5f23; --ink:#222; --ink2:#555; --line:#e2e2e2; --bg:#ffffff; --soft:#f3f8f3; }
  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{ margin:0; background:var(--bg); color:var(--ink);
        font-family:-apple-system,"Segoe UI","Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;
        font-size:16.5px; line-height:1.85; -webkit-text-size-adjust:100%; }
  .topbar{ position:sticky; top:0; z-index:10; background:var(--green); color:#fff;
           display:flex; align-items:center; justify-content:space-between;
           padding:10px 16px; box-shadow:0 2px 6px rgba(0,0,0,.18); }
  .topbar .t{ font-weight:700; font-size:16px; }
  .topbar a.top{ color:#fff; text-decoration:none; font-size:13px; font-weight:700;
                 border:1px solid rgba(255,255,255,.6); border-radius:16px; padding:3px 12px; white-space:nowrap; }
  .topbar a.top:active{ background:rgba(255,255,255,.2); }
  .wrap{ max-width:820px; margin:0 auto; padding:18px 18px 80px; }
  #content h1{ font-size:25px; line-height:1.4; margin:.4em 0 .5em; }
  #content h2{ font-size:20px; margin:1.6em 0 .5em; padding:6px 0 6px 12px;
               border-left:5px solid var(--green); color:var(--green-d); background:var(--soft); border-radius:0 6px 6px 0; }
  #content h3{ font-size:17.5px; margin:1.3em 0 .4em; color:var(--green-d); }
  #content h4{ font-size:16px; margin:1.1em 0 .3em; color:var(--ink2); }
  #content h1,#content h2,#content h3,#content h4{ scroll-margin-top:60px; }
  #content p{ margin:.6em 0; }
  #content a{ color:var(--green-d); text-decoration:underline; text-underline-offset:2px; word-break:break-word; }
  #content strong{ font-weight:700; }
  #content ul,#content ol{ margin:.5em 0; padding-left:1.5em; }
  #content li{ margin:.3em 0; }
  #content li > ul, #content li > ol{ margin:.3em 0; }
  #content blockquote{ margin:.8em 0; padding:8px 14px; background:var(--soft);
                       border-left:4px solid #9cc79e; border-radius:0 6px 6px 0; color:#2d4d2f; }
  #content blockquote p:first-child{ margin-top:0; }
  #content blockquote p:last-child{ margin-bottom:0; }
  #content code{ font-family:"SFMono-Regular",Consolas,Menlo,monospace; font-size:.9em;
                 background:#eef1ee; padding:1px 5px; border-radius:4px; }
  #content pre{ background:#f6f8fa; border:1px solid var(--line); border-radius:8px; padding:12px; overflow:auto; }
  #content pre code{ background:none; padding:0; font-size:.92em; line-height:1.6; }
  #content hr{ border:0; border-top:1px solid var(--line); margin:1.6em 0; }
  #content table{ border-collapse:collapse; width:100%; margin:.8em 0; font-size:15px; display:block; overflow-x:auto; }
  #content th,#content td{ border:1px solid var(--line); padding:7px 10px; text-align:left; vertical-align:top; }
  #content thead th{ background:var(--soft); color:var(--green-d); white-space:nowrap; }
  #content tbody tr:nth-child(even){ background:#fafcfa; }
  .msg{ padding:30px 10px; color:var(--ink2); }
  .msg a{ color:var(--green-d); }
</style>
</head>
<body>
  <div class="topbar">
    <span class="t">📖 取扱説明書</span>
    <a class="top" href="#top">▲ 先頭へ</a>
  </div>
  <div class="wrap" id="top">
    <div id="content"><div class="msg">読み込み中…</div></div>
  </div>

<script>
/* ---- self-contained Markdown renderer (ES5-safe) ---- */
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function ghSlug(text){
  var s=String(text).toLowerCase();
  try{ s=s.replace(new RegExp("[^\\p{L}\\p{N}\\p{Pc}\\- ]+","gu"),""); }
  catch(e){ s=s.replace(/[^0-9a-z_\- ぀-ゟ゠-ヺー-ヿ々㐀-鿿豈-﫿①-⓿０-ｚ]+/g,""); }
  return s.replace(/ /g,"-");
}
function inlineMd(s){
  var parts=String(s).split('`'), res='';
  for(var k=0;k<parts.length;k++){
    if(k%2===1){ res+='<code>'+esc(parts[k])+'</code>'; continue; }
    var t=esc(parts[k]);
    t=t.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
    t=t.replace(/\[([^\]]+)\]\(([^)]+)\)/g,function(_,txt,url){
      var ext=/^https?:/i.test(url);
      return '<a href="'+url+'"'+(ext?' target="_blank" rel="noopener"':'')+'>'+txt+'</a>';
    });
    res+=t;
  }
  return res;
}
function parseTable(lines,i,end){
  function cells(row){ var r=row.trim().replace(/^\|/,'').replace(/\|$/,''); return r.split('|').map(function(x){return x.trim();}); }
  var header=cells(lines[i]); i+=2; var body=[];
  while(i<end && /^\s*\|.*\|\s*$/.test(lines[i])){ body.push(cells(lines[i])); i++; }
  var h='<table><thead><tr>'; header.forEach(function(c){ h+='<th>'+inlineMd(c)+'</th>'; }); h+='</tr></thead><tbody>';
  body.forEach(function(row){ h+='<tr>'; row.forEach(function(c){ h+='<td>'+inlineMd(c)+'</td>'; }); h+='</tr>'; });
  return [h+'</tbody></table>',i];
}
function parseList(lines,i,end){
  var first=/^(\s*)([-*+]|\d+\.)\s+/.exec(lines[i]);
  var indent=first[1].length, ordered=/\d+\./.test(first[2]), tag=ordered?'ol':'ul', out='<'+tag+'>';
  while(i<end){
    if(/^\s*$/.test(lines[i])) break;
    var m=/^(\s*)([-*+]|\d+\.)\s+([\s\S]*)$/.exec(lines[i]); if(!m) break;
    var ind=m[1].length; if(ind<indent) break;
    if(ind>indent){ var sub=parseList(lines,i,end); out=out.replace(/<\/li>$/,'')+sub[0]+'</li>'; i=sub[1]; continue; }
    var content=m[3]; i++;
    while(i<end && !/^\s*$/.test(lines[i]) && !/^(\s*)([-*+]|\d+\.)\s+/.test(lines[i]) && /^\s+\S/.test(lines[i])){ content+=' '+lines[i].trim(); i++; }
    out+='<li>'+inlineMd(content)+'</li>';
  }
  return [out+'</'+tag+'>',i];
}
function blocksMd(lines,i,end,uniq){
  var out=''; uniq=uniq||function(t){return ghSlug(t);};
  while(i<end){
    var line=lines[i];
    if(/^\s*$/.test(line)){ i++; continue; }
    if(/^\s*```/.test(line)){ var buf=[]; i++; while(i<end && !/^\s*```/.test(lines[i])){ buf.push(lines[i]); i++; } i++; out+='<pre><code>'+esc(buf.join('\n'))+'</code></pre>'; continue; }
    var h=/^(#{1,6})\s+(.*)$/.exec(line);
    if(h){ var lvl=h[1].length, txt=h[2].replace(/\s+#+\s*$/,''); out+='<h'+lvl+' id="'+uniq(txt)+'">'+inlineMd(txt)+'</h'+lvl+'>'; i++; continue; }
    if(/^\s*([-*_])(\s*\1){2,}\s*$/.test(line)){ out+='<hr>'; i++; continue; }
    if(/^\s*\|.*\|\s*$/.test(line) && i+1<end && /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i+1]) && lines[i+1].indexOf('-')>=0){ var rt=parseTable(lines,i,end); out+=rt[0]; i=rt[1]; continue; }
    if(/^\s*>/.test(line)){ var qb=[]; while(i<end && /^\s*>/.test(lines[i])){ qb.push(lines[i].replace(/^\s*>\s?/,'')); i++; } out+='<blockquote>'+blocksMd(qb,0,qb.length,uniq)+'</blockquote>'; continue; }
    if(/^\s*([-*+]|\d+\.)\s+/.test(line)){ var rl=parseList(lines,i,end); out+=rl[0]; i=rl[1]; continue; }
    var pb=[];
    while(i<end && !/^\s*$/.test(lines[i]) && !/^\s*(#{1,6}\s|>|```)/.test(lines[i]) && !/^\s*([-*_])(\s*\1){2,}\s*$/.test(lines[i]) && !/^\s*([-*+]|\d+\.)\s+/.test(lines[i]) && !/^\s*\|.*\|\s*$/.test(lines[i])){ pb.push(lines[i]); i++; }
    out+='<p>'+inlineMd(pb.join(' '))+'</p>';
  }
  return out;
}
function renderMd(md){
  md=String(md).replace(/\r\n?/g,'\n').replace(/^﻿/,'');
  var lines=md.split('\n'), seen={};
  function uniq(t){ var b=ghSlug(t), s=b, n=1; while(seen[s]){ s=b+'-'+n; n++; } seen[s]=1; return s; }
  return blocksMd(lines,0,lines.length,uniq);
}
/* ---- load & render ---- */
(function(){
  var box=document.getElementById('content');
  fetch('manual.md',{cache:'no-store'}).then(function(r){ if(!r.ok) throw new Error(r.status); return r.text(); })
  .then(function(md){
    box.innerHTML=renderMd(md);
    var h1=box.querySelector('h1'); if(h1) document.title=h1.textContent.replace(/\s+/g,' ').trim();
  })
  .catch(function(e){
    box.innerHTML='<div class="msg">説明書を読み込めませんでした（'+esc(String(e&&e.message||e))+'）。<br>'
      +'ネットにつながっているか確認して、ページを再読み込みしてください。<br><br>'
      +'それでも開けないときは <a href="manual.md">manual.md を直接開く</a> こともできます。</div>';
  });
})();
</script>
</body>
</html>
