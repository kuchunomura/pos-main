<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>説明書</title>
<style>
  :root{ --green:#2f7d32; --green-d:#1f5f23; --ink:#222; --ink2:#555; --line:#e2e2e2; --bg:#ffffff; --soft:#f3f8f3; }
  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{ margin:0; background:var(--bg); color:var(--ink);
        font-family:-apple-system,"Segoe UI","Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;
        font-size:16.5px; line-height:1.85; -webkit-text-size-adjust:100%; }
  #topbar{ position:sticky; top:0; z-index:100; background:var(--green); color:#fff; box-shadow:0 2px 6px rgba(0,0,0,.18); }
  .tb-row1{ display:flex; align-items:center; justify-content:space-between; padding:9px 16px; }
  .tb-row1 .t{ font-weight:700; font-size:16px; }
  .tb-row1 a.top{ color:#fff; text-decoration:none; font-size:13px; font-weight:700;
                  border:1px solid rgba(255,255,255,.6); border-radius:16px; padding:3px 12px; white-space:nowrap; }
  .nav-row{ display:none; gap:6px; padding:0 12px 8px; overflow-x:auto; white-space:nowrap; }
  body.multi .nav-row{ display:flex; }
  .nav-row a{ flex:0 0 auto; color:#fff; text-decoration:none; font-size:13px; font-weight:700;
              background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.45); border-radius:14px; padding:3px 11px; }
  .nav-row a:active{ background:rgba(255,255,255,.32); }
  .ds-row{ display:flex; gap:6px; align-items:center; flex-wrap:wrap;
           background:#eaf4ea; padding:7px 12px; border-top:1px solid rgba(255,255,255,.35); }
  #ds-input{ flex:1; min-width:140px; font-size:16px; padding:9px 11px; border:1px solid #9cc79e;
             border-radius:8px; font-family:inherit; background:#fff; }
  .ds-row button{ font-size:14px; font-weight:700; color:var(--green-d); background:#fff;
                  border:1px solid #9cc79e; border-radius:8px; padding:8px 11px; cursor:pointer; font-family:inherit; }
  .ds-row button:active{ transform:translateY(1px); }
  #ds-count{ font-size:12px; color:var(--green-d); white-space:nowrap; min-width:52px; text-align:right; font-weight:700; }
  mark.ds-hl{ background:#ffe58a; color:#000; border-radius:2px; }
  mark.ds-hl.ds-cur{ background:#ff9800; color:#000; }
  .wrap{ max-width:820px; margin:0 auto; padding:18px 18px 80px; }
  .cover{ border:2px solid #9cc79e; border-radius:12px; padding:14px 16px; background:var(--soft); margin:4px 0 26px; }
  .cover h1{ margin:0 0 4px; font-size:24px; color:var(--green-d); }
  .cover p{ margin:.3em 0 .6em; color:var(--ink2); font-size:15px; }
  .cover ol{ margin:0; padding-left:0; list-style:none; }
  .cover li{ margin:7px 0; }
  .cover li a{ display:block; text-decoration:none; color:var(--ink); background:#fff; border:1px solid #cfe3cf;
               border-radius:9px; padding:9px 12px; }
  .cover li a b{ color:var(--green-d); font-size:16.5px; }
  .cover li a span{ display:block; font-size:13.5px; color:var(--ink2); line-height:1.6; }
  .part{ margin:34px 0 6px; padding:12px 14px; border-radius:10px; background:var(--green); color:#fff; }
  .part .pn{ font-size:13px; opacity:.9; font-weight:700; }
  .part .pt{ font-size:21px; font-weight:800; line-height:1.4; }
  .part .pd{ font-size:13.5px; opacity:.92; line-height:1.6; }
  .part .pu{ display:inline-block; margin-top:5px; font-size:12.5px; font-weight:700;
             background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.45); border-radius:10px; padding:0 9px; }
  .cover li a span.upd{ font-size:12.5px; color:var(--green-d); font-weight:700; margin-top:2px; }
  .upd1{ display:inline-block; font-size:12.5px; font-weight:700; color:var(--green-d); background:var(--soft);
         border:1px solid #cfe3cf; border-radius:10px; padding:1px 10px; margin-bottom:4px; }
  .part .pu:empty, .cover li a span.upd:empty, .upd1:empty{ display:none; }
  .doc{ scroll-margin-top:118px; }
  body.multi .doc{ scroll-margin-top:150px; }
  #content h1{ font-size:25px; line-height:1.4; margin:.4em 0 .5em; }
  #content h2{ font-size:20px; margin:1.6em 0 .5em; padding:6px 0 6px 12px;
               border-left:5px solid var(--green); color:var(--green-d); background:var(--soft); border-radius:0 6px 6px 0; }
  #content h3{ font-size:17.5px; margin:1.3em 0 .4em; color:var(--green-d); }
  #content h4{ font-size:16px; margin:1.1em 0 .3em; color:var(--ink2); }
  #content h1,#content h2,#content h3,#content h4{ scroll-margin-top:118px; }
  body.multi #content h1,body.multi #content h2,body.multi #content h3,body.multi #content h4{ scroll-margin-top:150px; }
  #content p{ margin:.6em 0; }
  #content .doc a{ color:var(--green-d); text-decoration:underline; text-underline-offset:2px; word-break:break-word; }
  #content strong{ font-weight:700; }
  #content ul,#content ol{ margin:.5em 0; padding-left:1.5em; }
  #content li{ margin:.3em 0; }
  #content li > ul, #content li > ol{ margin:.3em 0; }
  #content blockquote{ margin:.8em 0; padding:8px 14px; background:var(--soft);
                       border-left:4px solid #9cc79e; border-radius:0 6px 6px 0; color:#2d4d2f; }
  #content blockquote p:first-child{ margin-top:0; }
  #content blockquote p:last-child{ margin-bottom:0; }
  #content code{ font-family:"SFMono-Regular",Consolas,Menlo,monospace; font-size:.9em;
                 background:#eef1ee; padding:1px 5px; border-radius:4px; word-break:break-all; }
  #content pre{ background:#f6f8fa; border:1px solid var(--line); border-radius:8px; padding:12px; overflow:auto; }
  #content pre code{ background:none; padding:0; font-size:.92em; line-height:1.6; word-break:normal; }
  #content hr{ border:0; border-top:1px solid var(--line); margin:1.6em 0; }
  #content table{ border-collapse:collapse; width:100%; margin:.8em 0; font-size:15px; display:block; overflow-x:auto; }
  #content th,#content td{ border:1px solid var(--line); padding:7px 10px; text-align:left; vertical-align:top; }
  #content thead th{ background:var(--soft); color:var(--green-d); white-space:nowrap; }
  #content tbody tr:nth-child(even){ background:#fafcfa; }
  .msg{ padding:30px 10px; color:var(--ink2); }
  .msg a{ color:var(--green-d); }
  @media print{ #topbar{ display:none !important; } .part{ break-before:page; } }
</style>
</head>
<body>
  <div id="topbar">
    <div class="tb-row1">
      <span class="t" id="tb-title">📖 説明書</span>
      <a class="top" href="#top">▲ 先頭へ</a>
    </div>
    <div class="nav-row" id="nav-row"></div>
    <div class="ds-row">
      <input id="ds-input" type="search" placeholder="🔍 キーワードで探す（スペースで複数語）" autocomplete="off">
      <button id="ds-prev" title="前へ">↑ 前</button>
      <button id="ds-next" title="次へ">↓ 次</button>
      <span id="ds-count"></span>
    </div>
  </div>
  <div class="wrap" id="top">
    <div id="content"><div class="msg">読み込み中…</div></div>
  </div>

<script>
/* ===== 表示する説明書（上から順に連結）=====
   files を左から順に探し、見つかった md だけを表示する（無いものは飛ばす）。
   POSレジ：3冊すべて同じフォルダに有り → 第1部 引き継ぎ／第2部 取扱／第3部 集計
   予約アプリ：引き継ぎはレジ側(pos-main)の原本を読む → 第1部 引き継ぎ／第2部 予約の取扱 */
var DOCS=[
  {files:['引き継ぎ説明書.md','../pos-main/引き継ぎ説明書.md'], key:'handover', icon:'🧭', label:'引き継ぎ説明書', short:'引き継ぎ', desc:'システムを引き継ぐ人・改修する人向け（レジ・予約アプリ共通。Claude Code の使い方、GitHub・GASの仕組みなど）'},
  {files:['manual.md'],          key:'manual', icon:'📗', label:'取扱説明書',       short:'取扱説明書', desc:'スタッフ向け：アプリの使い方'},
  {files:['集計リファレンス.md'], key:'ref',    icon:'📊', label:'集計リファレンス', short:'集計', desc:'その数字はどこで・どう集計しているか（辞書）'}
];

/* ---- self-contained Markdown renderer (ES5-safe) ---- */
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function ghSlug(text){
  var s=String(text).toLowerCase();
  try{ s=s.replace(new RegExp("[^\\p{L}\\p{N}\\p{Pc}\\- ]+","gu"),""); }
  catch(e){ s=s.replace(/[^0-9a-z_\- ぀-ゟ゠-ヺー-ヿ々㐀-鿿豈-﫿①-⓿０-ｚ]+/g,""); }
  return s.replace(/ /g,"-");
}
function inlineMd(s){
  var parts=String(s).split('`'), res='';
  for(var k=0;k<parts.length;k++){
    if(k%2===1){ res+='<code>'+esc(parts[k])+'</code>'; continue; }
    var t=esc(parts[k]);
    t=t.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
    t=t.replace(/\[([^\]]+)\]\(([^)]+)\)/g,function(_,txt,url){
      var ext=/^https?:/i.test(url);
      return '<a href="'+url+'"'+(ext?' target="_blank" rel="noopener"':'')+'>'+txt+'</a>';
    });
    res+=t;
  }
  return res;
}
function parseTable(lines,i,end){
  function cells(row){ var r=row.trim().replace(/^\|/,'').replace(/\|$/,''); return r.split('|').map(function(x){return x.trim();}); }
  var header=cells(lines[i]); i+=2; var body=[];
  while(i<end && /^\s*\|.*\|\s*$/.test(lines[i])){ body.push(cells(lines[i])); i++; }
  var h='<table><thead><tr>'; header.forEach(function(c){ h+='<th>'+inlineMd(c)+'</th>'; }); h+='</tr></thead><tbody>';
  body.forEach(function(row){ h+='<tr>'; row.forEach(function(c){ h+='<td>'+inlineMd(c)+'</td>'; }); h+='</tr>'; });
  return [h+'</tbody></table>',i];
}
function parseList(lines,i,end){
  var first=/^(\s*)([-*+]|\d+\.)\s+/.exec(lines[i]);
  var indent=first[1].length, ordered=/\d+\./.test(first[2]), tag=ordered?'ol':'ul', out='<'+tag+'>';
  while(i<end){
    if(/^\s*$/.test(lines[i])) break;
    var m=/^(\s*)([-*+]|\d+\.)\s+([\s\S]*)$/.exec(lines[i]); if(!m) break;
    var ind=m[1].length; if(ind<indent) break;
    if(ind>indent){ var sub=parseList(lines,i,end); out=out.replace(/<\/li>$/,'')+sub[0]+'</li>'; i=sub[1]; continue; }
    var content=m[3]; i++;
    while(i<end && !/^\s*$/.test(lines[i]) && !/^(\s*)([-*+]|\d+\.)\s+/.test(lines[i]) && /^\s+\S/.test(lines[i])){ content+=' '+lines[i].trim(); i++; }
    out+='<li>'+inlineMd(content)+'</li>';
  }
  return [out+'</'+tag+'>',i];
}
function blocksMd(lines,i,end,uniq){
  var out='';
  while(i<end){
    var line=lines[i];
    if(/^\s*$/.test(line)){ i++; continue; }
    if(/^\s*```/.test(line)){ var buf=[]; i++; while(i<end && !/^\s*```/.test(lines[i])){ buf.push(lines[i]); i++; } i++; out+='<pre><code>'+esc(buf.join('\n'))+'</code></pre>'; continue; }
    var h=/^(#{1,6})\s+(.*)$/.exec(line);
    if(h){ var lvl=h[1].length, txt=h[2].replace(/\s+#+\s*$/,''); out+='<h'+lvl+' id="'+uniq(txt)+'">'+inlineMd(txt)+'</h'+lvl+'>'; i++; continue; }
    if(/^\s*([-*_])(\s*\1){2,}\s*$/.test(line)){ out+='<hr>'; i++; continue; }
    if(/^\s*\|.*\|\s*$/.test(line) && i+1<end && /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i+1]) && lines[i+1].indexOf('-')>=0){ var rt=parseTable(lines,i,end); out+=rt[0]; i=rt[1]; continue; }
    if(/^\s*>/.test(line)){ var qb=[]; while(i<end && /^\s*>/.test(lines[i])){ qb.push(lines[i].replace(/^\s*>\s?/,'')); i++; } out+='<blockquote>'+blocksMd(qb,0,qb.length,uniq)+'</blockquote>'; continue; }
    if(/^\s*([-*+]|\d+\.)\s+/.test(line)){ var rl=parseList(lines,i,end); out+=rl[0]; i=rl[1]; continue; }
    var pb=[];
    while(i<end && !/^\s*$/.test(lines[i]) && !/^\s*(#{1,6}\s|>|```)/.test(lines[i]) && !/^\s*([-*_])(\s*\1){2,}\s*$/.test(lines[i]) && !/^\s*([-*+]|\d+\.)\s+/.test(lines[i]) && !/^\s*\|.*\|\s*$/.test(lines[i])){ pb.push(lines[i]); i++; }
    out+='<p>'+inlineMd(pb.join(' '))+'</p>';
  }
  return out;
}
/* prefix を付けると、見出しidと文書内リンク(#...)に「prefix-」を付けて他の冊とぶつからないようにする。
   #doc-○○（冊の先頭）と #top はそのまま。 */
function renderMd(md,prefix){
  md=String(md).replace(/\r\n?/g,'\n').replace(/^﻿/,'');
  var lines=md.split('\n'), seen={};
  function uniq(t){ var b=ghSlug(t), s=b, n=1; while(seen[s]){ s=b+'-'+n; n++; } seen[s]=1; return prefix?prefix+'-'+s:s; }
  var html=blocksMd(lines,0,lines.length,uniq);
  if(prefix) html=html.replace(/href="#(?!doc-)(?!top")([^"]+)"/g,function(_,h){ return 'href="#'+prefix+'-'+h+'"'; });
  return html;
}
/* ==== ここまで純粋関数（テスト用の区切り）==== */

/* ---- in-page keyword search (全冊まとめて・複数語OR・ハイライト・前/次) ---- */
(function(){
  var input=document.getElementById('ds-input');
  var countEl=document.getElementById('ds-count');
  var marks=[], cur=-1, timer=null;
  function escRx(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
  function clear(){
    for(var i=0;i<marks.length;i++){ var m=marks[i], p=m.parentNode; if(p){ p.replaceChild(document.createTextNode(m.textContent),m); p.normalize(); } }
    marks=[]; cur=-1;
  }
  function partOf(el){ while(el&&el!==document.body){ if(el.getAttribute&&el.getAttribute('data-short')) return el.getAttribute('data-short'); el=el.parentNode; } return ''; }
  function paint(){
    for(var i=0;i<marks.length;i++){ marks[i].className='ds-hl'+(i===cur?' ds-cur':''); }
    if(cur>=0&&marks[cur]){
      marks[cur].scrollIntoView({block:'center',behavior:'smooth'});
      var pn=document.body.className.indexOf('multi')>=0?partOf(marks[cur]):'';
      countEl.textContent=(cur+1)+' / '+marks.length+(pn?'（'+pn+'）':'');
    }
  }
  function run(q){
    clear();
    var root=document.getElementById('content'); if(!root){ countEl.textContent=''; return; }
    if(!q){ countEl.textContent=''; return; }
    var terms=q.split(/[\s　]+/).filter(Boolean).map(escRx);
    if(!terms.length){ countEl.textContent=''; return; }
    var rx; try{ rx=new RegExp(terms.join('|'),'gi'); }catch(e){ return; }
    var walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:function(n){
      if(!n.nodeValue||!n.nodeValue.replace(/\s/g,'')) return NodeFilter.FILTER_REJECT;
      var p=n.parentNode; while(p){ var t=p.nodeName; if(t==='SCRIPT'||t==='STYLE') return NodeFilter.FILTER_REJECT; p=p.parentNode; }
      rx.lastIndex=0; return rx.test(n.nodeValue)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT;
    }});
    var nodes=[],n; while((n=walker.nextNode())) nodes.push(n);
    for(var k=0;k<nodes.length;k++){
      var node=nodes[k], text=node.nodeValue; rx.lastIndex=0;
      var m,last=0,frag=document.createDocumentFragment(),any=false;
      while((m=rx.exec(text))){
        any=true;
        if(m.index>last) frag.appendChild(document.createTextNode(text.slice(last,m.index)));
        var mk=document.createElement('mark'); mk.className='ds-hl'; mk.textContent=m[0]; frag.appendChild(mk); marks.push(mk);
        last=m.index+m[0].length;
        if(m[0].length===0) rx.lastIndex++;
      }
      if(any){ if(last<text.length) frag.appendChild(document.createTextNode(text.slice(last))); if(node.parentNode) node.parentNode.replaceChild(frag,node); }
    }
    if(marks.length){ cur=0; paint(); } else { countEl.textContent='0 件'; }
  }
  function step(d){ if(!marks.length) return; cur=(cur+d+marks.length)%marks.length; paint(); }
  input.addEventListener('input',function(){ clearTimeout(timer); var v=input.value; timer=setTimeout(function(){ run(v); },200); });
  input.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); if(marks.length) step(e.shiftKey?-1:1); else run(input.value); } });
  document.getElementById('ds-next').addEventListener('click',function(){ step(1); });
  document.getElementById('ds-prev').addEventListener('click',function(){ step(-1); });
  window.__dsRerun=function(){ if(input.value) run(input.value); };
})();

/* ---- 最終更新日：GitHub のその .md の最終コミット日（端末に6時間キャッシュ／取れない時は本文末尾の「最終更新:」）---- */
function fmtD(dt){ return dt.getFullYear()+'/'+('0'+(dt.getMonth()+1)).slice(-2)+'/'+('0'+dt.getDate()).slice(-2); }
function footerDate(md){
  var m=/最終更新[:：]\s*(\d{4})[\/\-年](\d{1,2})[\/\-月](\d{1,2})/.exec(md);
  return m?m[1]+'/'+('0'+m[2]).slice(-2)+'/'+('0'+m[3]).slice(-2):'';
}
function ghDate(absUrl){
  var m=/^https:\/\/([^.\/]+)\.github\.io\/([^\/]+)\/([^?#]+)/.exec(absUrl||'');
  if(!m) return Promise.resolve('');
  var owner=m[1], repo=m[2], path=decodeURIComponent(m[3]);
  var key='mdate:'+owner+'/'+repo+'/'+path, c=null;
  try{ c=JSON.parse(localStorage.getItem(key)||'null'); }catch(e){}
  if(c&&c.d&&Date.now()-c.t<6*3600*1000) return Promise.resolve(c.d);
  var api='https://api.github.com/repos/'+owner+'/'+repo+'/commits?per_page=1&path='+encodeURIComponent(path);
  return fetch(api).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); }).then(function(a){
    var cm=a&&a[0]&&a[0].commit, iso=cm&&((cm.committer&&cm.committer.date)||(cm.author&&cm.author.date));
    if(!iso) return c?c.d:'';
    var d=fmtD(new Date(iso));
    try{ localStorage.setItem(key,JSON.stringify({d:d,t:Date.now()})); }catch(e){}
    return d;
  }).catch(function(){ return c?c.d:''; });
}
function fillDates(got){
  got.forEach(function(x){
    ghDate(x.url).then(function(d){
      d=d||footerDate(x.md); if(!d) return;
      var els=document.querySelectorAll('[data-upd="'+x.d.key+'"]');
      for(var i=0;i<els.length;i++) els[i].textContent='🗓 最終更新 '+d;
    });
  });
}

/* ---- load & render ---- */
(function(){
  var box=document.getElementById('content');
  function tryFiles(files,i){
    if(i>=files.length) return Promise.resolve(null);
    var url=encodeURI(files[i]);
    return fetch(url,{cache:'no-store'})
      .then(function(r){ if(!r.ok) throw new Error(r.status); return r.text(); })
      .then(function(t){ var a=document.createElement('a'); a.href=url; return {md:t,url:a.href}; },
            function(){ return tryFiles(files,i+1); });
  }
  function load(d){ return tryFiles(d.files,0).then(function(r){ return r?{d:d,md:r.md,url:r.url}:null; }); }
  function h1Of(md){ return ((/^﻿?#\s+(.+)$/m.exec(md)||[])[1]||'').trim(); }
  Promise.all(DOCS.map(load)).then(function(res){
    var got=res.filter(function(x){ return x; });
    if(!got.length) throw new Error('説明書ファイルが見つかりません');
    if(got.length===1){
      // 1冊だけ：そのまま表示
      box.innerHTML='<div class="upd1" data-upd="'+got[0].d.key+'"></div><section class="doc" id="doc-'+got[0].d.key+'">'+renderMd(got[0].md,'')+'</section>';
      var h1=box.querySelector('h1'); if(h1) document.title=h1.textContent.replace(/\s+/g,' ').trim();
    } else {
      // 複数冊：表紙＋第1部〜を1ページに連結。見出しidは冊ごとに接頭辞を付けて衝突回避
      document.body.className+=' multi';
      // ページ名は取扱説明書の題名から（例「POSレジ 取扱説明書」→「POSレジ 説明書」、「予約アプリ（yoyaku）取扱説明書」→「予約アプリ（yoyaku）説明書」）
      var base=null; got.forEach(function(x){ if(x.d.key==='manual') base=x; });
      var ttl=h1Of((base||got[0]).md).replace(/取扱説明書|引き継ぎ説明書/,'説明書')||'説明書';
      document.title=ttl;
      document.getElementById('tb-title').textContent='📖 '+ttl;
      var cover='<div class="cover"><h1>'+esc(ttl)+'</h1><p>この1ページに <b>'+got.length+'冊</b> をまとめています。上の 🔍 で全部まとめて検索できます。</p><ol>';
      var nav='', body='';
      got.forEach(function(x,i){
        var d=x.d, pn='第'+(i+1)+'部';
        cover+='<li><a href="#doc-'+d.key+'"><b>'+pn+'　'+d.icon+' '+esc(d.label)+'</b><span>'+esc(d.desc)+'</span><span class="upd" data-upd="'+d.key+'"></span></a></li>';
        nav+='<a href="#doc-'+d.key+'">'+d.icon+' '+esc(d.short)+'</a>';
        body+='<section class="doc" id="doc-'+d.key+'" data-short="'+esc(pn+' '+d.short)+'">'
             +'<div class="part"><div class="pn">'+pn+'</div><div class="pt">'+d.icon+' '+esc(d.label)+'</div><div class="pd">'+esc(d.desc)+'</div><div class="pu" data-upd="'+d.key+'"></div></div>'
             +renderMd(x.md,d.key)+'</section>';
      });
      cover+='</ol></div>';
      document.getElementById('nav-row').innerHTML=nav;
      box.innerHTML=cover+body;
    }
    fillDates(got);
    if(window.__dsRerun) window.__dsRerun();
    // 別ページから #doc-○○ 付きで来たとき（旧URLの転送など）、描画後にその位置へ
    if(location.hash){
      var id=decodeURIComponent(location.hash.slice(1)), el=document.getElementById(id);
      if(el) setTimeout(function(){ el.scrollIntoView(); },60);
    }
  }).catch(function(e){
    box.innerHTML='<div class="msg">説明書を読み込めませんでした（'+esc(String(e&&e.message||e))+'）。<br>'
      +'ネットにつながっているか確認して、ページを再読み込みしてください。</div>';
  });
})();
</script>
</body>
</html>
